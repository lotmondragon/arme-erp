# Plantilla de referencia para el Secret de Kubernetes.
# Copia este archivo a secrets.yaml (ignorado por git) y reemplaza los valores
# antes de aplicarlo a un cluster real:
#
#   cp infra/k8s/secrets.example.yaml infra/k8s/secrets.yaml
#   # editar infra/k8s/secrets.yaml con valores reales
#   kubectl apply -f infra/k8s/secrets.yaml
#
# En un entorno productivo real, preferir un gestor de secretos externo
# (Sealed Secrets, External Secrets Operator, Vault, etc.) en vez de aplicar
# este manifiesto directamente.
apiVersion: v1
kind: Secret
metadata:
  name: arme-secrets
  namespace: arme-erp
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_TO_SECURE_PASSWORD"
  ConnectionStrings__DefaultConnection: "Host=postgres-service;Port=5432;Database=arme_erp;Username=arme;Password=CHANGE_ME_TO_SECURE_PASSWORD"
  CLIENT_SECRET: "CHANGE_ME_TO_VERY_LONG_SECURE_SECRET"
